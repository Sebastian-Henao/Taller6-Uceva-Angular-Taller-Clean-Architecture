<div class="table-responsive">
  <table class="table table-striped table-hover align-middle border">
    <caption class="caption-top">Catálogo de canciones</caption>
    <thead class="table-light">
      <tr>
        <th scope="col">ID</th>
        <th scope="col">Canción</th>
        <th scope="col">Duración (segundos)</th>
        <th scope="col">Género</th>
        <th scope="col">ID artista</th>
        <th scope="col">ID álbum</th>
      </tr>
    </thead>
    <tbody>
      @for (song of music; track song.id) {
        <tr>
          <th scope="row">{{ song.id }}</th>
          <td>{{ song.title }}</td>
          <td>{{ song.durationSeconds }}</td>
          <td><span class="badge text-bg-primary">{{ song.genre }}</span></td>
          <td>{{ song.artistId }}</td>
          <td>{{ song.albumId }}</td>
        </tr>
      } @empty {
        <tr>
          <td colspan="6" class="text-center text-muted">No hay canciones disponibles.</td>
        </tr>
      }
    </tbody>
  </table>
</div>
