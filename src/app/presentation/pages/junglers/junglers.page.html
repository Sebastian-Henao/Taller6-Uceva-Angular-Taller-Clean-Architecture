@switch(state){

    @case('loading'){
        <app-alert alertState="loading" text="Cargando Campeones Junglers..." ></app-alert>
    }

    @case('error'){
        <app-alert alertState="error" text="Error al Cargar los Campeones Junglers" ></app-alert>
    }

    @case('success'){
        <app-junglers-table [junglers]="junglers" ></app-junglers-table>
    }

}
